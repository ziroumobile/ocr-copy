<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖片文字辨識 OCR</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2563eb; --border:#d9dde3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1a1e24; --text:#e8eaed; --muted:#9aa0a8; --accent:#60a5fa; --border:#2e343c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Noto Sans TC",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  #drop { border:2px dashed var(--border); border-radius:12px; padding:32px 16px; text-align:center; color:var(--muted); cursor:pointer; }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  #preview { max-width:100%; max-height:320px; display:none; margin:12px auto 0; border-radius:8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  select, button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; }
  progress { width:100%; height:8px; display:none; margin-top:12px; }
  #status { color:var(--muted); font-size:.9rem; margin-top:8px; min-height:1.2em; }
  textarea { width:100%; min-height:220px; padding:12px; font:inherit; line-height:1.5; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); resize:vertical; }
  .hint { color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>圖片文字辨識 OCR</h1>

  <div class="card">
    <div id="drop" tabindex="0">點擊選擇圖片、拖曳到這裡，或直接貼上（Ctrl+V）截圖</div>
    <input id="file" type="file" accept="image/*" hidden>
    <img id="preview" alt="預覽">
    <div class="row">
      <label>引擎
        <select id="engine">
          <option value="paddle">高精度（PaddleOCR，建議）</option>
          <option value="tess">Tesseract（支援日韓）</option>
        </select>
      </label>
      <label>文字方向
        <select id="dir">
          <option value="h">橫排</option>
          <option value="v">直排（由右到左）</option>
        </select>
      </label>
      <label class="tess">語言
        <select id="lang">
          <option value="chi_tra+eng">繁體中文 + 英文</option>
          <option value="chi_sim+eng">簡體中文 + 英文</option>
          <option value="eng">英文</option>
          <option value="jpn+eng">日文 + 英文</option>
          <option value="kor+eng">韓文 + 英文</option>
        </select>
      </label>
      <label class="tess">版面
        <select id="psm">
          
          <option value="3">自動（建議）</option>
          <option value="6">單一文字區塊</option>
          <option value="7">單行</option>
        </select>
      </label>
      <button id="run" class="primary" disabled>開始辨識</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="trad" checked> 輸出轉為繁體中文（修正模型誤輸出的簡體字）</label>
    </div>
    <div class="row tess">
      <label><input type="checkbox" id="pre" checked> 圖片前處理（放大、反相、二值化，建議開啟）</label>
    </div>
    <img id="proc" alt="前處理後" style="max-width:100%;max-height:200px;display:none;margin-top:8px;border-radius:8px">
    <progress id="bar" max="1" value="0"></progress>
    <div id="status"></div>
  </div>

  <div class="card">
    <textarea id="out" placeholder="辨識結果會顯示在這裡，可直接修改"></textarea>
    <div class="row">
      <button id="copy" disabled>複製文字</button>
      <button id="clear" disabled>清除</button>
      <span class="hint">所有辨識都在你的瀏覽器內完成，圖片不會上傳。</span>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), fileIn = $('file'), prev = $('preview'), run = $('run'),
      out = $('out'), copyBtn = $('copy'), clearBtn = $('clear'), bar = $('bar'), status = $('status');
let image = null;

function setImage(f) {
  if (!f || !f.type.startsWith('image/')) return;
  image = f;
  prev.src = URL.createObjectURL(f);
  prev.style.display = 'block';
  run.disabled = false;
  status.textContent = '';
}

drop.onclick = () => fileIn.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') fileIn.click(); };
fileIn.onchange = () => setImage(fileIn.files[0]);
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => setImage(e.dataTransfer.files[0]));
document.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) setImage(item.getAsFile());
});

const LANG_PATH = 'https://cdn.jsdelivr.net/gh/naptha/tessdata@gh-pages/4.0.0_best';
const CJK = '　-〿぀-ヿ㐀-鿿＀-￯';
// remove spaces next to CJK characters (OCR engines insert them between characters)
const CJK_GAP = new RegExp(`[ \t]+(?=[${CJK}])|(?<=[${CJK}])[ \t]+`, 'g');
const ORT_BASE = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/';
const MODEL_BASE = 'https://cdn.jsdelivr.net/npm/@gutenye/ocr-models@1.4.2/assets/';
let paddle;

function loadScript(src) {
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.onload = res; el.onerror = () => rej(new Error('無法載入 ' + src));
    document.head.append(el);
  });
}

async function loadPaddle() {
  if (paddle) return paddle;
  if (!window.ort) await loadScript(ORT_BASE + 'ort.min.js');
  ort.env.wasm.wasmPaths = ORT_BASE;
  ort.env.wasm.numThreads = 1;
  const opt = { executionProviders: ['wasm'] };
  const [det, rec, dict] = await Promise.all([
    ort.InferenceSession.create(MODEL_BASE + 'ch_PP-OCRv4_det_infer.onnx', opt),
    ort.InferenceSession.create(MODEL_BASE + 'ch_PP-OCRv4_rec_infer.onnx', opt),
    fetch(MODEL_BASE + 'ppocr_keys_v1.txt').then(r => r.text()),
  ]);
  const lines = dict.split(String.fromCharCode(10)).map(l => l.trim());
  if (lines[lines.length - 1] === '') lines.pop();
  paddle = { det, rec, chars: ['', ...lines, ' '] }; // index 0 = CTC blank
  return paddle;
}

// canvas -> Float32 NCHW (BGR), value = (px/255 - mean) / std
function toTensor(canvas, mean, std) {
  const { width: w, height: h } = canvas;
  const px = canvas.getContext('2d').getImageData(0, 0, w, h).data, out = new Float32Array(3 * w * h);
  for (let i = 0; i < w * h; i++) for (let c = 0; c < 3; c++)
    out[c * w * h + i] = (px[i * 4 + 2 - c] / 255 - mean[c]) / std[c];
  return new ort.Tensor('float32', out, [1, 3, h, w]);
}

function resizedCanvas(src, sx, sy, sw, sh, dw, dh) {
  const c = document.createElement('canvas'); c.width = dw; c.height = dh;
  const ctx = c.getContext('2d'); ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, dw, dh);
  return c;
}

// DB text detection: probability map -> connected regions -> unclipped boxes (original image coords)
async function detectBoxes(det, full) {
  const mx = Math.max(full.width, full.height);
  const ratio = mx > 960 ? 960 / mx : mx < 640 ? 640 / mx : 1;
  const dw = Math.max(32, Math.round(full.width * ratio / 32) * 32), dh = Math.max(32, Math.round(full.height * ratio / 32) * 32);
  const input = toTensor(resizedCanvas(full, 0, 0, full.width, full.height, dw, dh), [0.485, 0.456, 0.406], [0.229, 0.224, 0.225]);
  const res = await det.run({ [det.inputNames[0]]: input });
  const prob = res[det.outputNames[0]].data, n = dw * dh;
  const seen = new Uint8Array(n), stack = new Int32Array(n), boxes = [];
  for (let s = 0; s < n; s++) {
    if (prob[s] <= 0.3 || seen[s]) continue;
    let sp = 0, cnt = 0, sum = 0, x0 = dw, x1 = 0, y0 = dh, y1 = 0;
    stack[sp++] = s; seen[s] = 1;
    while (sp) {
      const p = stack[--sp], x = p % dw, y = (p - x) / dw;
      cnt++; sum += prob[p];
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (const q of [x > 0 ? p - 1 : -1, x < dw - 1 ? p + 1 : -1, y > 0 ? p - dw : -1, y < dh - 1 ? p + dw : -1])
        if (q >= 0 && prob[q] > 0.3 && !seen[q]) { seen[q] = 1; stack[sp++] = q; }
    }
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    if (Math.min(bw, bh) < 3 || sum / cnt < 0.6) continue;
    const d = bw * bh * 1.5 / (2 * (bw + bh)); // DB unclip
    boxes.push({
      x0: Math.max(0, (x0 - d) / dw * full.width), x1: Math.min(full.width, (x1 + 1 + d) / dw * full.width),
      y0: Math.max(0, (y0 - d) / dh * full.height), y1: Math.min(full.height, (y1 + 1 + d) / dh * full.height),
    });
  }
  return boxes;
}

// vertical column -> cut into square-ish cells and lay them side by side so glyphs stay upright
function stitchColumn(full, b) {
  const bw = b.x1 - b.x0, bh = b.y1 - b.y0;
  const n = Math.max(1, Math.round(bh / bw)), seg = bh / n, cell = Math.max(8, Math.round(48 * bw / seg));
  const c = document.createElement('canvas'); c.width = Math.min(2000, n * cell); c.height = 48;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, 48);
  ctx.imageSmoothingQuality = 'high';
  for (let i = 0; i < n; i++) ctx.drawImage(full, b.x0, b.y0 + i * seg, bw, seg, i * cell, 0, cell, 48);
  return c;
}

async function recognizeBox(rec, chars, full, b, vertical) {
  const bw = b.x1 - b.x0, bh = b.y1 - b.y0;
  const w = Math.min(2000, Math.max(16, Math.ceil(48 * bw / bh)));
  const img = vertical && bh > bw * 1.2 ? stitchColumn(full, b) : resizedCanvas(full, b.x0, b.y0, bw, bh, w, 48);
  const input = toTensor(img, [0.5, 0.5, 0.5], [0.5, 0.5, 0.5]);
  const res = await rec.run({ [rec.inputNames[0]]: input });
  const o = res[rec.outputNames[0]], [, T, C] = o.dims;
  let text = '', last = 0;
  for (let t = 0; t < T; t++) {
    let best = 0, bv = -Infinity;
    for (let c = 0; c < C; c++) { const v = o.data[t * C + c]; if (v > bv) { bv = v; best = c; } }
    if (best !== 0 && best !== last) text += chars[best] ?? '';
    last = best;
  }
  return text;
}

async function paddleOcr(file, onProgress) {
  const { det, rec, chars } = await loadPaddle();
  const bmp = await createImageBitmap(file);
  const full = document.createElement('canvas'); full.width = bmp.width; full.height = bmp.height;
  full.getContext('2d').drawImage(bmp, 0, 0);
  const boxes = await detectBoxes(det, full);
  const vertical = $('dir').value === 'v';
  // horizontal: group boxes into rows by vertical overlap; vertical: group into columns by horizontal overlap
  const lo = vertical ? 'x0' : 'y0', hi = vertical ? 'x1' : 'y1', alo = vertical ? 'y0' : 'x0';
  boxes.sort((a, b) => a[lo] - b[lo]);
  const lines = [];
  for (const b of boxes) {
    const c = (b[lo] + b[hi]) / 2, sz = b[hi] - b[lo];
    const line = lines.find(l => Math.abs(l.c - c) < Math.min(l.sz, sz) * 0.5);
    if (line) { line.items.push(b); line.c = (line.c + c) / 2; line.sz = Math.max(line.sz, sz); }
    else lines.push({ c, sz, items: [b] });
  }
  if (vertical) lines.sort((a, b) => b.c - a.c); // columns read right to left
  let done = 0; const outLines = [];
  for (const l of lines) {
    l.items.sort((a, b) => a[alo] - b[alo]);
    const parts = [];
    for (const b of l.items) {
      parts.push(await recognizeBox(rec, chars, full, b, vertical));
      onProgress(++done / boxes.length);
    }
    outLines.push(parts.filter(Boolean).join(vertical ? '' : ' '));
  }
  return outLines.join(String.fromCharCode(10));
}

let toTrad;
async function finalize(text) {
  text = text.replace(CJK_GAP, '').trim();
  if (!$('trad').checked) return text;
  try {
    if (!toTrad) {
      if (!window.OpenCC) await loadScript('https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js');
      toTrad = OpenCC.Converter({ from: 'cn', to: 'tw' });
    }
    return toTrad(text);
  } catch { return text; } // conversion is best-effort
}

function syncEngine() {
  document.querySelectorAll('.tess').forEach(el => el.style.display = $('engine').value === 'tess' ? '' : 'none');
  if ($('engine').value === 'paddle') $('proc').style.display = 'none';
}
$('engine').onchange = syncEngine;
syncEngine();

// Upscale, grayscale, Otsu-binarize; output is always black text on white.
async function preprocess(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(3, Math.max(1, 1000 / Math.max(bmp.width, bmp.height))); // only upscale small images
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data, n = c.width * c.height;
  const g = new Uint8Array(n), hist = new Array(256).fill(0);
  let sum = 0;
  for (let i = 0; i < n; i++) {
    const v = (d[i*4] * 0.299 + d[i*4+1] * 0.587 + d[i*4+2] * 0.114) | 0;
    g[i] = v; hist[v]++; sum += v;
  }
  let sumB = 0, wB = 0, best = 0, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = n - wB; if (!wF) break;
    sumB += t * hist[t];
    const between = wB * wF * (sumB / wB - (sum - sumB) / wF) ** 2;
    if (between > best) { best = between; thr = t; }
  }
  let dark = 0; for (let i = 0; i < n; i++) if (g[i] <= thr) dark++;
  const darkBg = dark > n / 2; // majority dark => background dark, text is light
  // box mean via integral image: small radius denoises grain, large radius gives local threshold
  const W = c.width, H = c.height, I = new Float64Array((W + 1) * (H + 1));
  for (let y = 0; y < H; y++) {
    let row = 0;
    for (let x = 0; x < W; x++) { row += g[y*W+x]; I[(y+1)*(W+1)+x+1] = I[y*(W+1)+x+1] + row; }
  }
  const mean = (x, y, r) => {
    const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1), y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
    return (I[y1*(W+1)+x1] - I[y0*(W+1)+x1] - I[y1*(W+1)+x0] + I[y0*(W+1)+x0]) / ((x1-x0) * (y1-y0));
  };
  const bin = new Uint8Array(n), r = Math.max(2, Math.round(scale * 2));
  const R = Math.max(40, Math.round(Math.max(W, H) / 10));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = mean(x, y, r), m = mean(x, y, R);
    const isText = darkBg ? v > m + 12 : v < m - 12;
    bin[y*W+x] = isText ? 1 : 0;
  }
  // drop speckles: connected text-pixel blobs smaller than minArea
  const minArea = Math.max(20, Math.round(n / 20000)), stack = new Int32Array(n), list = new Int32Array(n), seen = new Uint8Array(n);
  let ptr = 0;
  for (let s = 0; s < n; s++) {
    if (!bin[s] || seen[s]) continue;
    let sp = 0, cnt = 0; stack[sp++] = s; seen[s] = 1;
    let x0 = W, x1 = 0, y0 = H, y1 = 0;
    const start = ptr;
    while (sp) {
      const p = stack[--sp]; cnt++; list[ptr++] = p;
      const px = p % W, py = (p - px) / W;
      if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
      for (const q of [px > 0 ? p - 1 : -1, px < W - 1 ? p + 1 : -1, p >= W ? p - W : -1, p < n - W ? p + W : -1])
        if (q >= 0 && bin[q] && !seen[q]) { seen[q] = 1; stack[sp++] = q; }
    }
    // remove tiny specks, and big sparse clusters (grain/vignette) that are far less dense than any glyph
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    const sparse = (bw > W / 4 || bh > H / 4) && cnt / (bw * bh) < 0.25;
    if (cnt < minArea || sparse) for (let k = start; k < ptr; k++) bin[list[k]] = 0;
  }
  for (let i = 0; i < n; i++) {
    d[i*4] = d[i*4+1] = d[i*4+2] = bin[i] ? 0 : 255; d[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

run.onclick = async () => {
  if (!image) return;
  run.disabled = true;
  bar.style.display = 'block'; bar.value = 0;
  status.textContent = '載入中…（首次使用需下載模型，約 15–30 MB）';
  let worker;
  try {
    if ($('engine').value === 'paddle') {
      const text = await paddleOcr(image, p => { bar.value = p; status.textContent = `辨識中 ${Math.round(p * 100)}%`; });
      out.value = await finalize(text);
      status.textContent = out.value ? '完成' : '沒有辨識到文字';
      copyBtn.disabled = clearBtn.disabled = !out.value;
      return;
    }
    let input = image;
    if ($('pre').checked) {
      input = await preprocess(image);
      $('proc').src = input.toDataURL(); $('proc').style.display = 'block';
    } else $('proc').style.display = 'none';
    worker = await Tesseract.createWorker($('lang').value, 1, {
      langPath: LANG_PATH,
      logger: m => {
        if (m.status === 'recognizing text') {
          bar.value = m.progress;
          status.textContent = `辨識中 ${Math.round(m.progress * 100)}%`;
        }
      }
    });
    await worker.setParameters({ tessedit_pageseg_mode: $('psm').value });
    const { data } = await worker.recognize(input);
    out.value = await finalize(data.text);
    status.textContent = out.value ? '完成' : '沒有辨識到文字';
    copyBtn.disabled = clearBtn.disabled = !out.value;
  } catch (err) {
    status.textContent = '辨識失敗：' + err.message;
  } finally {
    if (worker) worker.terminate();
    run.disabled = false;
    bar.style.display = 'none';
  }
};

copyBtn.onclick = async () => {
  try { await navigator.clipboard.writeText(out.value); }
  catch { out.select(); document.execCommand('copy'); }
  copyBtn.textContent = '已複製 ✓';
  setTimeout(() => copyBtn.textContent = '複製文字', 1500);
};
clearBtn.onclick = () => { out.value = ''; copyBtn.disabled = clearBtn.disabled = true; };
out.oninput = () => copyBtn.disabled = clearBtn.disabled = !out.value;
</script>
</body>
</html>
